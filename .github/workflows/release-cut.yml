---
name: Cut Release

# One-click release gate: verifies the tag and npm version are free, then
# opens a version-bump pull request for the requested version. Merging that
# PR bumps main, which triggers the tag-on-merge workflow and then
# "Publish Packages" (npm, GitHub Release with the VSIX, Neovim artifact
# branch). When the manifests already match the requested version, the tag
# is created directly.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without v (for example, 0.2.30)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  cut:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate requested version
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Version must be X.Y.Z, got: $VERSION" >&2
            exit 1
          }

      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: 22.x
          check-latest: true

      - name: Verify the tag and npm version are free
        run: |
          if git ls-remote --exit-code --tags origin \
            "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists on origin;" \
              "tags are immutable." >&2
            exit 1
          fi
          if npm view "@rifen/timescope-core@$VERSION" version \
            >/dev/null 2>&1; then
            echo "Version $VERSION is already published to npm." >&2
            exit 1
          fi

      - name: Open the version-bump pull request
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "Manifests already at $VERSION; proceeding to tag."
            echo "tag_now=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BRANCH="chore/release-bump-v$VERSION"
          if git ls-remote --heads origin "$BRANCH" | grep -q .; then
            echo "Branch $BRANCH already exists on origin."
          else
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$BRANCH"
            node scripts/bump-versions.mjs "$VERSION"
            git add package.json packages/core/package.json \
              packages/nvim/package.json packages/vscode/package.json
            git commit -m "chore(release): bump version to $VERSION"
            gh auth setup-git
            git push -u origin "$BRANCH"
          fi
          if gh pr list --head "$BRANCH" --state open --json number \
            -q '.[0].number' | grep -q .; then
            echo "Version-bump PR for $VERSION already exists."
          else
            {
              echo "Automated version bump for the $VERSION release."
              echo
              echo "Merging publishes v$VERSION: npm, GitHub Release with"
              echo "the VSIX, and the Neovim artifact branch."
            } > "$RUNNER_TEMP/bump-pr-body.md"
            gh pr create --base main --head "$BRANCH" \
              --title "chore(release): bump to $VERSION" \
              --body-file "$RUNNER_TEMP/bump-pr-body.md"
          fi
          echo "::notice::Merge the version-bump PR to publish the release."
          echo "tag_now=false" >> "$GITHUB_OUTPUT"

      - name: Verify manifests match the requested version
        if: steps.bump.outputs.tag_now == 'true'
        run: node scripts/check-versions.mjs --expect "$VERSION"

      - name: Create the annotated tag on main
        if: steps.bump.outputs.tag_now == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="v$VERSION" \
            -f message="Release version $VERSION" \
            -f object="$SHA" \
            -f type="commit" \
            --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v$VERSION" \
            -f sha="$TAG_SHA" > /dev/null
          echo "Created refs/tags/v$VERSION at $SHA"

      - name: Confirm the tag is on origin
        if: steps.bump.outputs.tag_now == 'true'
        run: |
          git ls-remote --tags origin "refs/tags/v$VERSION" \
            | grep -q "refs/tags/v$VERSION"
