name: Opengrep SAST

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Opengrep
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
          echo "$HOME/.opengrep/cli/latest" >> "$GITHUB_PATH"

      - name: Run Opengrep scan
        # Report findings without blocking existing PRs until the baseline is triaged.
        continue-on-error: true
        run: opengrep scan --config auto --error --sarif-output=opengrep.sarif .

      - name: Upload Opengrep SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@a35ac6e6798d72df5475948b28efb89edc2e19ca
        with:
          sarif_file: opengrep.sarif
          category: opengrep
