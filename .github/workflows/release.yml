name: Publish Packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish (for example, v0.2.29)"
        required: true
        type: string

permissions:
  id-token: write
  contents: write

jobs:
  publish-core:
    runs-on: ubuntu-latest
    outputs:
      core_version: ${{ steps.core-version.outputs.new_version }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}

      # pnpm must be installed before setup-node configures its pnpm cache.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: 22.x
          check-latest: true
          registry-url: "https://registry.npmjs.org"
          cache: 'pnpm'

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install dependencies
        run: |
          pnpm install --filter @rifen/timescope-core --ignore-scripts \
            --frozen-lockfile

      - name: Build core
        run: pnpm --filter @rifen/timescope-core run build

      - name: Determine core version from tag
        id: core-version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          echo "Release tag: $RELEASE_TAG"
          echo "Tag version: $TAG_VERSION"

          # Check if tag version already exists on npm
          if npm view @rifen/timescope-core@$TAG_VERSION version \
            2>/dev/null; then
            echo "ERROR: Version $TAG_VERSION already exists on npm." \
              "Use a new tag."
            exit 1
          fi

          NEW_VERSION="$TAG_VERSION"
          echo "Publishing version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "core_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Set core package version
        run: |
          cd packages/core
          pnpm version "${{ steps.core-version.outputs.new_version }}" \
            --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: packages/core

  github-release:
    needs: publish-core
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: 22.x
          check-latest: true
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --ignore-scripts \
            --frozen-lockfile

      - name: Build all packages
        run: pnpm -r run build

      - name: Package the VSIX
        run: |
          cd packages/vscode
          npx @vscode/vsce package --no-dependencies \
            --out "${{ github.workspace }}/timescope.vsix"

      - name: Create the GitHub Release with the VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists;" \
              "immutable releases prevent asset changes."
          else
            gh release create "$TAG" \
              "${{ github.workspace }}/timescope.vsix" \
              --title "TimeScope $TAG" \
              --generate-notes \
              --verify-tag
          fi

      - name: Publish the Neovim artifact branch and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_DIR="${{ runner.temp }}/nvim-artifact"
          rm -rf "$ARTIFACT_DIR" && mkdir -p "$ARTIFACT_DIR/bin"
          cp -r packages/nvim/lua "$ARTIFACT_DIR/lua"
          cp packages/nvim/bin/timescope-bridge.js "$ARTIFACT_DIR/bin/"
          rm -f "$ARTIFACT_DIR/lua/timescope/lazy.lua" \
            "$ARTIFACT_DIR/lua/timescope/lazy-example.lua"
          {
            echo "# TimeScope for Neovim (prebuilt)"
            echo ""
            echo "Install with lazy.nvim:"
            echo ""
            echo '```lua'
            echo "{ 'rifen/timescope', tag = 'nvim-${TAG}' }"
            echo '```'
            echo ""
            echo "Requires Neovim >= 0.7 and Node.js >= 18."
          } > "$ARTIFACT_DIR/README.md"
          cp LICENSE "$ARTIFACT_DIR/LICENSE"
          cd "$ARTIFACT_DIR"
          git init -q -b nvim
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q \
            -m "TimeScope Neovim plugin $TAG (built by CI from packages/nvim)"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          git push --force origin nvim
          if git ls-remote --tags origin "refs/tags/nvim-$TAG" | \
            grep -q .; then
            echo "Tag nvim-$TAG already exists; tags are immutable."
          else
            git tag -a "nvim-$TAG" -m "TimeScope Neovim plugin $TAG"
            git push origin "refs/tags/nvim-$TAG"
          fi
