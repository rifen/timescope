name: Publish Packages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  id-token: write
  contents: write

jobs:
  publish-core:
    runs-on: ubuntu-latest
    outputs:
      core_version: ${{ steps.core-version.outputs.new_version }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: 22.x
          check-latest: true
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Install dependencies
        run: pnpm install --filter @rifen/timescope-core --ignore-scripts --frozen-lockfile

      - name: Build core
        run: pnpm --filter @rifen/timescope-core run build

      - name: Determine core version from tag
        id: core-version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"

          # Check if tag version already exists on npm
          if npm view @rifen/timescope-core@$TAG_VERSION version 2>/dev/null; then
            echo "ERROR: Version $TAG_VERSION already exists on npm. Use a new tag."
            exit 1
          fi

          NEW_VERSION="$TAG_VERSION"
          echo "Publishing version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "core_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Set core package version
        run: |
          cd packages/core
          pnpm version "${{ steps.core-version.outputs.new_version }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: packages/core
