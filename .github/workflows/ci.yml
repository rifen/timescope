name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify package versions match
        run: node scripts/check-versions.mjs

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build all packages
        run: pnpm -r run build

      - name: Run core tests
        run: pnpm --filter @rifen/timescope-core test

      - name: Run Neovim bridge tests
        run: pnpm --filter timescope-nvim test

      - name: Run VS Code unit tests
        run: pnpm --filter rifen-timescope unit-test

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          check-latest: true

      - name: Install Neovim and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y neovim xvfb

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run editor E2E tests
        run: xvfb-run -a pnpm test:e2e

      - name: Run Neovim installation test
        run: bash scripts/test-nvim-install.sh

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          check-latest: true

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build all packages
        run: pnpm -r run build

      - name: Build VS Code extension (bundles core)
        run: |
          cd packages/vscode
          pnpm run build

      - name: Package VS Code extension
        run: |
          cd packages/vscode
          npx @vscode/vsce package --no-dependencies --out timescope.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: timescope-vscode
          path: packages/vscode/*.vsix
